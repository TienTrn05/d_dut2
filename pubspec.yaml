name: e_dut
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.10.0
  aad_oauth: ^1.0.1
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7
  dio: ^5.8.0+1

  #state management
  flutter_bloc: ^9.0.0
  dartx: ^1.2.0

  # local storage
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  rx_shared_preferences: ^4.0.0

  # ui
  google_fonts: ^6.2.1
  iconify_flutter: ^0.0.7
  flutter_spinkit: ^5.2.1
  animated_splash_screen: ^1.3.0
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # talker & logger
  talker_flutter: ^4.6.11
  table_calendar: ^3.2.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  card_loading: ^0.3.2
  month_picker_dialog: ^6.0.2

  signalr_netcore: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  rename_app: ^1.6.2
  flutter_launcher_icons: ^0.14.3

  injectable_generator: ^2.7.0
  build_runner: ^2.4.15

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/icons/svg/
    - assets/images/
