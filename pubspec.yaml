name: e_dut
description: "A dDUT project."
publish_to: "none"
version: 1.2.4+31

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.10.0
  aad_oauth: ^1.0.1
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7
  dio: ^5.8.0+1

  # new dependencies
  fl_chart: 1.0.0
  fluentui_system_icons: ^1.1.219
  file_picker: ^10.3.1
  open_mail_launcher: ^0.1.0

  # generation models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  #state management
  flutter_bloc: ^9.0.0
  dartx: ^1.2.0

  # local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  rx_shared_preferences: ^4.0.0

  # ui
  google_fonts: ^6.2.1
  iconify_flutter: ^0.0.7
  flutter_vector_icons: ^2.0.0
  flutter_spinkit: ^5.2.1
  animated_splash_screen: ^1.3.0
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_html: ^3.0.0

  # dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # talker & logger
  talker_flutter: ^4.6.11
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  card_loading: ^0.3.2
  month_picker_dialog: ^6.0.2

  # firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  provider: ^6.1.5

  signalr_netcore: ^1.4.3
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  flutter_linkify: ^6.0.0
  linkify: ^5.0.0
  flutter_native_splash: ^2.4.6

  bloc: ^9.0.0
  http: ^1.5.0

  app_settings: ^6.1.1

  # app utils
  new_version_plus: ^0.1.0
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  rename_app: ^1.6.2
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.3

  injectable_generator: ^2.7.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  auto_route_generator: ^10.2.3
  flutter_gen_runner: ^5.10.0
  intl_utils: ^2.8.10
  retrofit_generator: ^9.2.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/icons/svg/
    - assets/images/
    - assets/icons/logo_full.png
    - assets/icons/svg/logo_dut.svg
    - assets/icons/svg/dDUT.svg
    - assets/icons/svg/bg_pattern.svg
    - assets/icons/svg/logo_dDUTcolor.svg
    - assets/data/chatbots.json

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/logo_full.png # Logo splash
  android: true
  ios: true
  fullscreen: true

  android_gravity: center
  ios_content_mode: scaleAspectFit

  android_12:
    color: "#FFFFFF"
    image: assets/icons/logo_full.png
